name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Build site
        run: |
          mkdir dist
          cp index.html dist/
          touch dist/.nojekyll
          curl -fsS -A "Extra-Games/1.0" \
            "https://www.playstation.com/bin/imagic/gameslist?locale=en-us&categoryList=plus-games-list" \
            -o dist/games.json \
          || cp games.json dist/games.json
          python3 -c "import json; json.load(open('dist/games.json'))"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
